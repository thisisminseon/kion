<body>
<div id="root" data-theme="light">

<script>
'use strict';
/* ---------- 保存データ（設定のみ。現在地の座標は保存しない） ---------- */
const KEY = 'kion.v1';
const DEFAULTS = { place: null, recents: [], sens: 'normal', move: 'train', taste: 'casual', out: '08:00', back: '19:00', done: false };
let S = Object.assign({}, DEFAULTS);
try { S = Object.assign(S, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* ---------- 実行時の状態 ---------- */
const G = { coords: null, wx: null, wxKey: '', wxAt: 0, wxLoading: false, wxError: '', geoBusy: false, geoMsg: '', query: '', results: null, searching: false, variant: 0, skyKey: '' };

const SUGGEST = [
  { name: '北九州市 小倉北区', sub: '福岡県', lat: 33.8835, lon: 130.8752 },
  { name: '福岡市 中央区', sub: '福岡県', lat: 33.5892, lon: 130.3928 },
  { name: '大分市', sub: '大分県', lat: 33.2396, lon: 131.6093 },
  { name: '熊本市 中央区', sub: '熊本県', lat: 32.8031, lon: 130.7079 }
];
const SENS = { cold: '寒がり', normal: 'ふつう', hot: '暑がり' };
const MOVE = { walk: '徒歩', bike: '自転車', train: '電車・バス', car: '車' };
const TASTE = { casual: 'カジュアル', clean: 'きれいめ', office: 'オフィス', outdoor: 'アウトドア' };

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const R = Math.round;
const pad2 = (n) => String(n).padStart(2, '0');

/* ---------- 空（デザインの kionSky をそのまま移植） ---------- */
function kionTime(h) {
  if (h >= 5 && h < 10) return 'morning';
  if (h >= 10 && h < 16) return 'day';
  if (h >= 16 && h < 19) return 'evening';
  return 'night';
}
function kionSky(time, weather) {
  const k = 1, rk = 'kion-rain';
  const r = (i, s) => { const x = Math.sin(i * 12.9898 + s * 78.233) * 43758.5453; return x - Math.floor(x); };
  const f = (n) => Math.round(n * 100) / 100;
  const night = time === 'evening' || time === 'night';
  const dark = night || weather === 'thunder';
  const Gd = {
    'morning-clear': 'linear-gradient(180deg, #93b6ea 0%, #c3cdef 40%, #f5d3c8 74%, #ffe7c6 100%)',
    'day-clear': 'linear-gradient(180deg, #78aef3 0%, #a3c9fa 40%, #d3e7fd 80%, #eaf4fe 100%)',
    'evening-clear': 'linear-gradient(180deg, #161c46 0%, #3a2c6a 45%, #7c4478 72%, #c4626a 90%, #ee9a68 100%)',
    'night-clear': 'linear-gradient(180deg, #040a1c 0%, #0b1838 45%, #16295a 80%, #1f3568 100%)',
    'light-cloudy': 'linear-gradient(180deg, #b8c6d8 0%, #d2dce7 55%, #e6ecf2 100%)',
    'dark-cloudy': 'linear-gradient(180deg, #0c1222 0%, #1a2338 55%, #2a3450 100%)',
    'light-rain': 'linear-gradient(180deg, #b0bccb 0%, #c6cfda 50%, #dbe2ea 100%)',
    'dark-rain': 'linear-gradient(180deg, #070c18 0%, #121a2c 55%, #202a3e 100%)',
    'thunder': 'linear-gradient(180deg, #04070e 0%, #0f1524 50%, #1d2436 100%)'
  };
  const key = weather === 'clear' ? time + '-clear' : weather === 'thunder' ? 'thunder' : (night ? 'dark-' : 'light-') + weather;
  const L = [];
  const add = (style, inner) => L.push('<div style="position: absolute; pointer-events: none; ' + style + '">' + (inner ? '<div style="' + inner + '"></div>' : '') + '</div>');
  add('inset: 0; background: ' + (Gd[key] || Gd['day-clear']) + ';');
  if (weather === 'clear') {
    const glow = {
      morning: 'radial-gradient(60% 50% at 12% 100%, rgba(255,186,140,0.7), rgba(255,186,140,0) 70%)',
      day: 'radial-gradient(45% 40% at 88% 0%, rgba(255,255,255,0.6), rgba(255,255,255,0) 70%)',
      evening: 'radial-gradient(70% 40% at 70% 100%, rgba(255,150,90,0.55), rgba(255,150,90,0) 70%)',
      night: 'radial-gradient(40% 30% at 85% 5%, rgba(180,200,255,0.18), rgba(180,200,255,0) 70%)'
    };
    add('inset: 0; background: ' + glow[time] + ';');
  }
  if ((time === 'morning' || time === 'day') && (weather === 'clear' || weather === 'cloudy')) {
    const m = time === 'morning';
    const s = (m ? 170 : 150) * k;
    const pos = m ? 'left: 9%; top: 58%; ' : 'right: 9%; top: 6%; ';
    const op = weather === 'cloudy' ? 'opacity: 0.4; ' : '';
    const anim = weather === 'clear' ? ' animation: kion-glow 6s ease-in-out infinite;' : '';
    add(pos + op + 'width: ' + f(s * 3.2) + 'px; height: ' + f(s * 3.2) + 'px; margin: ' + f(-s * 1.1) + 'px; border-radius: 50%; background: radial-gradient(circle, ' + (m ? 'rgba(255,200,150,0.6)' : 'rgba(255,240,200,0.65)') + ' 0%, rgba(255,255,255,0) 65%);');
    add(pos + op + 'width: ' + f(s) + 'px; height: ' + f(s) + 'px; border-radius: 50%; background: radial-gradient(circle, ' + (m ? '#fff4e0 0%, #ffc98a 55%, #ff9f6b 100%' : '#fffdf2 0%, #fff0b8 55%, #ffd36b 100%') + '); box-shadow: 0 0 ' + f(80 * k) + 'px ' + f(20 * k) + 'px ' + (m ? 'rgba(255,170,110,0.55)' : 'rgba(255,225,140,0.6)') + ';' + anim);
  }
  if (time === 'night' && (weather === 'clear' || weather === 'cloudy')) {
    const s = 92 * k;
    const op = weather === 'cloudy' ? 'opacity: 0.55; ' : '';
    add('right: 12%; top: 9%; ' + op + 'width: ' + f(s * 3) + 'px; height: ' + f(s * 3) + 'px; margin: ' + f(-s) + 'px; border-radius: 50%; background: radial-gradient(circle, rgba(220,230,255,0.3) 0%, rgba(220,230,255,0) 65%);');
    add('right: 12%; top: 9%; ' + op + 'width: ' + f(s) + 'px; height: ' + f(s) + 'px; border-radius: 50%; background: radial-gradient(circle at 38% 38%, #fffef6 0%, #f1ecd8 60%, #d9d2b8 100%); box-shadow: 0 0 ' + f(50 * k) + 'px ' + f(8 * k) + 'px rgba(255,248,220,0.35);');
  }
  const starN = time === 'night' ? (weather === 'clear' ? 80 : weather === 'cloudy' ? 16 : 0) : (time === 'evening' && weather === 'clear' ? 20 : 0);
  for (let i = 0; i < starN; i++) {
    const sz = f((1 + r(i, 3) * 1.8) * Math.max(k, 0.7));
    add('left: ' + f(r(i, 1) * 100) + '%; top: ' + f(r(i, 2) * (time === 'evening' ? 35 : 65)) + '%; width: ' + sz + 'px; height: ' + sz + 'px; border-radius: 50%; background: #ffffff; box-shadow: 0 0 ' + f(sz * 3) + 'px rgba(255,255,255,0.8); animation: kion-twinkle ' + f(2 + r(i, 4) * 4) + 's ease-in-out ' + f(-r(i, 5) * 6) + 's infinite;');
  }
  if (weather === 'rain' || weather === 'thunder') {
    add('left: 0; right: 0; top: 0; height: 45%; background: linear-gradient(180deg, ' + (weather === 'thunder' ? 'rgba(6,8,16,0.75)' : night ? 'rgba(10,14,26,0.6)' : 'rgba(120,135,155,0.35)') + ', rgba(0,0,0,0));');
  }
  const cloudN = weather === 'clear' ? (time === 'night' ? 0 : 3) : weather === 'cloudy' ? 8 : weather === 'rain' ? 9 : 10;
  const cc = weather === 'clear' ? (time === 'evening' ? 'rgba(255,170,190,0.28)' : 'rgba(255,255,255,0.6)') : weather === 'cloudy' ? (night ? 'rgba(70,84,115,0.55)' : 'rgba(255,255,255,0.72)') : weather === 'rain' ? (night ? 'rgba(42,52,74,0.75)' : 'rgba(132,146,166,0.5)') : 'rgba(26,32,48,0.9)';
  for (let i = 0; i < cloudN; i++) {
    const w = (360 + r(i, 7) * 380) * k;
    const top = weather === 'clear' ? 8 + r(i, 10) * 30 : -10 + r(i, 10) * 45;
    add('left: ' + f(-15 + r(i, 9) * 100) + '%; top: ' + f(top) + '%; width: ' + f(w) + 'px; height: ' + f(w * (0.32 + r(i, 8) * 0.14)) + 'px; border-radius: 50%; background: ' + cc + '; filter: blur(' + f(26 * k) + 'px); animation: kion-drift ' + f(40 + r(i, 11) * 40) + 's ease-in-out ' + f(-r(i, 12) * 60) + 's infinite alternate;');
  }
  if (weather === 'rain' || weather === 'thunder') {
    const th = weather === 'thunder';
    const n = th ? 150 : 110;
    const dc = dark ? 'rgba(200,215,240,0.55)' : 'rgba(70,92,125,0.42)';
    for (let i = 0; i < n; i++) {
      add('left: ' + f(-5 + r(i, 13) * 120) + '%; top: 0; width: ' + (th ? 1.8 : 1.4) + 'px; height: ' + f((50 + r(i, 14) * 50) * k) + 'px; border-radius: 2px; background: linear-gradient(180deg, rgba(255,255,255,0) 0%, ' + dc + ' 100%); animation: ' + rk + ' ' + f((0.5 + r(i, 15) * 0.45) * (th ? 0.85 : 1)) + 's linear ' + f(-r(i, 16) * 1.2) + 's infinite;');
    }
    add('left: 0; right: 0; bottom: 0; height: 30%; background: linear-gradient(0deg, ' + (dark ? 'rgba(120,140,180,0.18)' : 'rgba(255,255,255,0.35)') + ', rgba(255,255,255,0));');
  }
  if (weather === 'thunder') {
    add('inset: 0; opacity: 0; background: radial-gradient(70% 55% at 28% 8%, rgba(225,232,255,0.9), rgba(170,190,255,0.35) 55%, rgba(170,190,255,0) 80%); animation: kion-flash 7s linear 0s infinite;');
    add('inset: 0; opacity: 0; background: radial-gradient(60% 50% at 76% 6%, rgba(225,232,255,0.8), rgba(170,190,255,0) 70%); animation: kion-flash 9s linear -4s infinite;');
    const bolt = 'width: 100%; height: 100%; background: linear-gradient(180deg, #ffffff, #dbe6ff); clip-path: polygon(40% 0%, 68% 0%, 50% 36%, 74% 36%, 26% 100%, 40% 54%, 18% 54%);';
    add('left: 22%; top: 0; width: ' + f(110 * k) + 'px; height: ' + f(380 * k) + 'px; opacity: 0; filter: drop-shadow(0 0 ' + f(16 * k) + 'px rgba(200,215,255,0.95)); animation: kion-flash 7s linear 0s infinite;', bolt);
    add('left: 74%; top: 2%; width: ' + f(80 * k) + 'px; height: ' + f(280 * k) + 'px; opacity: 0; filter: drop-shadow(0 0 ' + f(14 * k) + 'px rgba(200,215,255,0.95)); animation: kion-flash 9s linear -4s infinite;', bolt);
  }
  return { html: L.join(''), dark: dark };
}

/* ---------- 天気コード ---------- */
function wcat(code) {
  if (code >= 95) return 'thunder';
  if ((code >= 71 && code <= 77) || code === 85 || code === 86) return 'snow';
  if (code >= 51) return 'rain';
  if (code === 3 || code === 45 || code === 48) return 'cloudy';
  if (code === 2) return 'partly';
  return 'clear';
}
function wlabel(code) {
  if (code === 0) return '快晴';
  if (code === 1) return '晴れ';
  if (code === 2) return '晴れ時々くもり';
  if (code === 3) return 'くもり';
  if (code === 45 || code === 48) return '霧';
  if (code >= 51 && code <= 57) return '霧雨';
  if (code >= 61 && code <= 67) return '雨';
  if (code >= 71 && code <= 77) return '雪';
  if (code >= 80 && code <= 82) return 'にわか雨';
  if (code === 85 || code === 86) return 'にわか雪';
  if (code >= 95) return '雷雨';
  return '—';
}
const skyWeather = (cat) => (cat === 'partly' ? 'clear' : cat === 'snow' ? 'cloudy' : cat);
const windDir = (deg) => ['北', '北東', '東', '南東', '南', '南西', '西', '北西'][R(((deg % 360) + 360) % 360 / 45) % 8];
function uvLabel(v) {
  const n = R(v || 0);
  return n + ' ' + (n < 1 ? 'なし' : n < 3 ? '弱い' : n < 6 ? '中程度' : n < 8 ? '強い' : n < 11 ? '非常に強い' : '極端に強い');
}

function updateSky() {
  let hour = new Date().getHours(), weather = 'clear';
  if (G.wx && route() !== 'location-none') {
    hour = parseInt(G.wx.current.time.slice(11, 13), 10);
    weather = skyWeather(wcat(G.wx.current.weather_code));
  }
  const time = kionTime(hour);
  const key = time + '/' + weather;
  if (key === G.skyKey) return;
  G.skyKey = key;
  const sky = kionSky(time, weather);
  document.getElementById('sky').innerHTML = sky.html;
  document.getElementById('root').setAttribute('data-theme', sky.dark ? 'dark' : 'light');
}

/* ---------- 位置情報・天気の取得 ---------- */
function placeCoords() {
  if (!S.place) return null;
  if (S.place.geo) return G.coords;
  return { lat: S.place.lat, lon: S.place.lon };
}
function geoErrorText(err) {
  if (!('geolocation' in navigator)) return 'このブラウザは位置情報に対応していません。地域を検索してください。';
  if (err && err.code === 1) return '位置情報の利用が許可されませんでした。ブラウザのアドレスバーから許可するか、下で地域を検索してください。';
  if (err && err.code === 3) return '位置情報の取得がタイムアウトしました。もう一度お試しいただくか、地域を検索してください。';
  return '現在地を取得できませんでした。もう一度お試しいただくか、地域を検索してください。';
}
/* ブラウザの許可ダイアログでユーザーが同意した場合のみ座標が得られる */
function getPosition() {
  return new Promise((resolve, reject) => {
    if (!('geolocation' in navigator)) { reject(null); return; }
    navigator.geolocation.getCurrentPosition(
      (p) => resolve({ lat: R(p.coords.latitude * 100) / 100, lon: R(p.coords.longitude * 100) / 100 }),
      (e) => reject(e),
      { enableHighAccuracy: false, timeout: 15000, maximumAge: 600000 }
    );
  });
}
async function reverseName(c) {
  try {
    const res = await fetch('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=' + c.lat + '&longitude=' + c.lon + '&localityLanguage=ja');
    const j = await res.json();
    const parts = [];
    [j.city, j.locality].forEach((x) => { if (x && parts.indexOf(x) < 0) parts.push(x); });
    return { name: parts.join(' ') || '現在地', sub: (j.principalSubdivision ? j.principalSubdivision + ' · ' : '') + '現在地' };
  } catch (e) {
    return { name: '現在地', sub: '現在地' };
  }
}
async function useGeo(thenRender) {
  if (G.geoBusy) return false;
  G.geoBusy = true; G.geoMsg = '';
  if (thenRender) render();
  try {
    const c = await getPosition();
    G.coords = c;
    const n = await reverseName(c);
    S.place = { geo: true, name: n.name, sub: n.sub };
    save();
    G.geoBusy = false;
    return true;
  } catch (e) {
    G.geoBusy = false;
    G.geoMsg = geoErrorText(e);
    return false;
  }
}
async function loadWeather(force) {
  const c = placeCoords();
  if (!c) return;
  const key = c.lat + ',' + c.lon;
  if (!force && G.wx && G.wxKey === key && Date.now() - G.wxAt < 10 * 60 * 1000) return;
  if (G.wxLoading) return;
  G.wxLoading = true; G.wxError = '';
  if (G.wxKey !== key) G.wx = null;
  try {
    const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + c.lat + '&longitude=' + c.lon +
      '&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,wind_direction_10m,is_day' +
      '&hourly=temperature_2m,apparent_temperature,precipitation_probability,precipitation,weather_code,uv_index' +
      '&daily=temperature_2m_max,temperature_2m_min&wind_speed_unit=ms&timezone=auto&forecast_days=3';
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json();
    if (!j.current || !j.hourly) throw new Error('bad response');
    G.wx = j; G.wxKey = key; G.wxAt = Date.now();
  } catch (e) {

function analyze() {
  const wx = G.wx, H = wx.hourly;
  const nowH = parseInt(wx.current.time.slice(11, 13), 10);
  const oh = parseInt(S.out.slice(0, 2), 10) || 0;
  const bh = parseInt(S.back.slice(0, 2), 10) || 0;
  const i0 = oh;
  const i1 = Math.min(i0 + (((bh - oh + 24) % 24) || 1), H.time.length - 1);
  let minF = Infinity, maxF = -Infinity, minT = Infinity, maxT = -Infinity, pMax = 0, mmMax = 0, iCold = i0, iHot = i0;
  let thunder = false, rainy = false, snowy = false, uvMax = 0;
  for (let i = i0; i <= i1; i++) {
    const f = H.apparent_temperature[i], t = H.temperature_2m[i];
    if (f < minF) { minF = f; iCold = i; }
    if (f > maxF) maxF = f;
    if (t < minT) minT = t;
    if (t > maxT) { maxT = t; iHot = i; }
    pMax = Math.max(pMax, H.precipitation_probability[i] || 0);
    mmMax = Math.max(mmMax, H.precipitation[i] || 0);
    uvMax = Math.max(uvMax, H.uv_index[i] || 0);
    const c = wcat(H.weather_code[i]);
    if (c === 'thunder') thunder = true;
    if (c === 'rain') rainy = true;
    if (c === 'snow') snowy = true;
  }
  const wet = thunder || rainy || pMax >= 60;
  const adj = ({ cold: -3, normal: 0, hot: 3 }[S.sens] || 0) + ({ walk: 0, bike: -2, train: 0, car: 2 }[S.move] || 0) + (wet ? -1 : 0);
  return { nowH, oh, bh, i0, i1, minF, maxF, minT, maxT, pMax, mmMax, uvMax, iCold, iHot, thunder, rainy, snowy, wet, diff: R(maxT) - R(minT), E: minF + adj, D: maxF + adj };
}

/* 大きな都市は Open-Meteo、駅名・町名は OpenStreetMap (Nominatim) で探して合わせる */
async function searchPlaces(q) {
  const r4 = (n) => R(n * 10000) / 10000;
  const uniq = (arr, name) => arr.filter((x, i) => x && x !== name && arr.indexOf(x) === i).join(' · ');
  const om = async (name, minPop) => {
    try {
      const j = await (await fetch('https://geocoding-api.open-meteo.com/v1/search?count=5&language=ja&format=json&name=' + encodeURIComponent(name))).json();
      return (j.results || []).filter((r) => (r.population || 0) >= minPop).map((r) => ({ name: r.name, sub: uniq([/^[\x00-\x7f]+$/.test(r.admin2 || '') ? '' : r.admin2, r.admin1, r.country], r.name), lat: r4(r.latitude), lon: r4(r.longitude) }));
    } catch (e) { return null; }
  };
  const osm = async () => {
    try {
      const j = await (await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=6&accept-language=ja&q=' + encodeURIComponent(q))).json();
      return j.map((r) => {
        const a = r.address || {};
        const name = (r.name || q) + (r.addresstype === 'railway' && !/駅$/.test(r.name || '') ? '駅' : '');
        return { name: name, sub: uniq([a.suburb, a.city || a.town || a.village || a.county, a.province || a.state, a.country_code === 'jp' ? '' : a.country], r.name), lat: r4(+r.lat), lon: r4(+r.lon) };
      });
    } catch (e) { return null; }
  };
  const parts = await Promise.all([om(q, 50000), /[市区町村]$/.test(q) ? [] : om(q + '市', 50000), osm(), om(q, 0)]);
  if (parts.every((p) => p === null)) throw new Error('search failed');
  const out = [];
  parts.forEach((p) => (p || []).forEach((x) => {
    if (out.length < 6 && isFinite(x.lat) && isFinite(x.lon) && !out.some((y) => (y.name === x.name && y.sub === x.sub) || (Math.abs(y.lat - x.lat) < 0.02 && Math.abs(y.lon - x.lon) < 0.02))) out.push(x);
  }));
  return out;
}

function onSearchInput(v) {

  G.results = null;

    if (seq !== searchSeq || G.query !== v) return;
    G.results = out;

  }, 600);

function chartHtml(a) {

function importCode(text) {
  try {
    const j = JSON.parse(decodeURIComponent(escape(atob(text.trim()))));
    const okTime = (t) => /^\d{2}:\d{2}$/.test(t);
    const okPlace = (p) => p && typeof p.name === 'string' && (p.geo === true || (typeof p.lat === 'number' && typeof p.lon === 'number'));
    if (!SENS[j.sens] || !MOVE[j.move] || !TASTE[j.taste] || !okTime(j.out) || !okTime(j.back) || !okPlace(j.place)) throw 0;
    const clean = (p) => (p.geo ? { geo: true, name: p.name, sub: String(p.sub || '現在地') } : { name: p.name, sub: String(p.sub || ''), lat: p.lat, lon: p.lon });
    S = Object.assign({}, DEFAULTS, { sens: j.sens, move: j.move, taste: j.taste, out: j.out, back: j.back, place: clean(j.place), recents: (Array.isArray(j.recents) ? j.recents : []).filter((p) => okPlace(p) && !p.geo).slice(0, 4).map(clean), done: true });
    save();
    return true;
  } catch (e) { return false; }
}

/* ---------- ルーティングと描画 ---------- */
function route() {
  const h = location.hash.replace(/^#\/?/, '');
  return ['location', 'preference', 'home'].indexOf(h) >= 0 ? h : 'main';
}
function render() {
  const r = route();
  if ((r === 'home' || r === 'preference') && !S.place) { location.replace('#/location'); return; }
  const active = document.activeElement, keepId = active && active.id, selS = active && active.selectionStart;
  document.getElementById('app').innerHTML = r === 'home' ? viewHome() : r === 'location' ? viewLocation() : r === 'preference' ? viewPreference() : viewMain();
  if (keepId) { const el = document.getElementById(keepId); if (el) { el.focus(); try { if (selS != null) el.setSelectionRange(selS, selS); } catch (e) {} } }
  updateSky();
}
function go(hash) { if (location.hash === hash) render(); else location.hash = hash; }
function onRoute() {
  const r = route();
  G.needPlace = false;
  document.title = { main: 'kion. — 気温から、今日の服を。', location: '地域設定 — kion.', preference: '体感・好み設定 — kion.', home: '今日のコーデ — kion.' }[r];

document.addEventListener('click', async (ev) => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const act = el.getAttribute('data-act');
  if (act === 'geo') {
    const ok = await useGeo(true);
    G.needPlace = false;
    if (ok) { G.query = ''; G.results = null; loadWeather(true); }
    render();
  } else if (act === 'pick') {
    const p = (G.listItems || [])[+el.getAttribute('data-i')];
    if (!p) return;
    S.place = p.geo ? p : { name: p.name, sub: p.sub, lat: p.lat, lon: p.lon };
    if (!p.geo) S.recents = [S.place].concat(S.recents.filter((q) => !samePlace(q, S.place))).slice(0, 4);
    save(); G.needPlace = false; G.geoMsg = '';
    render();
    if (placeCoords()) loadWeather(false);
  } else if (act === 'loc-next') {
    if (!S.place) { G.needPlace = true; render(); return; }
    go(S.done ? '#/home' : '#/preference');
  } else if (act === 'set') {
    S[el.getAttribute('data-k')] = el.getAttribute('data-v'); save(); G.variant = 0; render();
  } else if (act === 'finish') {
    S.done = true; save(); go('#/home');
  } else if (act === 'variant') {
    G.variant++; render();
  } else if (act === 'refresh' || act === 'retry') {
    G.geoMsg = ''; G.wxError = ''; render(); ensureHomeData(true);
  } else if (act === 'sync') {
    openSync('');
  } else if (act === 'sync-close') {
    document.getElementById('sync').close();
  } else if (act === 'sync-copy') {
    const t = document.getElementById('sync-out');
    t.select();
    try { await navigator.clipboard.writeText(t.value); } catch (e) { try { document.execCommand('copy'); } catch (e2) {} }
    el.textContent = 'コピーしました';
  } else if (act === 'sync-import') {
    const v = document.getElementById('sync-in').value;
    if (!v.trim()) { openSync('コードを貼り付けてください。'); return; }
    if (importCode(v)) { document.getElementById('sync').close(); G.wx = null; G.coords = null; go('#/home'); }
    else openSync('コードを読み取れませんでした。もう一度コピーしてお試しください。');
  }
});
document.addEventListener('input', (ev) => {
  if (ev.target.id === 'place-search') onSearchInput(ev.target.value);
});
document.addEventListener('change', (ev) => {
  const id = ev.target.id;
  if ((id === 't-out' || id === 't-back') && /^\d{2}:\d{2}/.test(ev.target.value)) {
    S[id === 't-out' ? 'out' : 'back'] = ev.target.value.slice(0, 5); save();
  }
});
/* 特長カード：カーソルの位置に合わせて光を動かす */
document.addEventListener('pointermove', (ev) => {
  const el = ev.target.closest && ev.target.closest('.feat');
  if (!el) return;
  const b = el.getBoundingClientRect();
  el.style.setProperty('--mx', (ev.clientX - b.left) + 'px');
  el.style.setProperty('--my', (ev.clientY - b.top) + 'px');
});
window.addEventListener('hashchange', onRoute);
setInterval(() => { G.skyKey = G.skyKey; updateSky(); }, 60000);
setInterval(() => { if (route() === 'home' && !document.hidden) ensureHomeData(true); }, 10 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && route() === 'home') ensureHomeData(false); });
onRoute();
</script>
</body>
